<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12K Sprite Flicker Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --ui-bg: #0f0f0f;
            --ui-card: #1a1a1a;
            --accent: #00ff88;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--ui-bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 100px;
        }

        /* Control Panel */
        .panel {
            background: var(--ui-card);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            border: 1px solid var(--border);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 10px; text-transform: uppercase; color: #888; font-weight: bold; }
        input, select { 
            background: #000; border: 1px solid var(--border); 
            color: white; padding: 10px; border-radius: 5px; 
        }

        /* Preview Canvas */
        #render-target {
            padding: 40px;
            background: repeating-conic-gradient(#222 0% 25%, #111 0% 50%) 50% / 20px 20px;
            border-radius: 8px;
            display: inline-block;
            text-align: center;
            margin: 40px 0;
        }

        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #preview-img { max-width: 300px; max-height: 300px; object-fit: contain; }
        #preview-text { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; }

        /* Animation Keyframes */
        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.1; }
        }

        .flicker-active { animation: flicker 0.5s infinite; }

        button {
            grid-column: 1 / -1;
            padding: 15px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        #sprite-preview-container {
            width: 90%;
            overflow-x: auto;
            background: #000;
            padding: 20px;
            border: 1px solid var(--accent);
            display: none;
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="group">
            <label>1. Upload Image</label>
            <input type="file" id="fileIn" accept="image/*" onchange="loadFile(event)">
        </div>
        <div class="group">
            <label>2. Text Label</label>
            <input type="text" id="textIn" value="ERROR_SYSTEM" oninput="update()">
        </div>
        <div class="group">
            <label>3. Flicker Target</label>
            <select id="target" onchange="update()">
                <option value="both">Both</option>
                <option value="image">Image Only</option>
                <option value="text">Text Only</option>
            </select>
        </div>
        <div class="group">
            <label>4. Total Frames</label>
            <input type="number" id="frameCount" value="8" min="2" max="24">
        </div>
        <button onclick="generateSpritesheet()">🚀 GENERATE TRANSPARENT SPRITESHEET</button>
    </div>

    <div id="render-target">
        <div class="content-box" id="capture-box">
            <img id="preview-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
            <div id="preview-text">ERROR_SYSTEM</div>
        </div>
    </div>

    <div id="sprite-preview-container">
        <label>Final Spritesheet (Right click to save)</label>
        <div id="canvas-result"></div>
    </div>

    <script>
        function loadFile(event) {
            const img = document.getElementById('preview-img');
            img.src = URL.createObjectURL(event.target.files[0]);
        }

        function update() {
            const text = document.getElementById('textIn').value;
            const target = document.getElementById('target').value;
            const imgEl = document.getElementById('preview-img');
            const textEl = document.getElementById('preview-text');
            
            textEl.innerText = text;

            // Apply live preview animation
            imgEl.classList.remove('flicker-active');
            textEl.classList.remove('flicker-active');

            if(target === 'both' || target === 'image') imgEl.classList.add('flicker-active');
            if(target === 'both' || target === 'text') textEl.classList.add('flicker-active');
        }

        async function generateSpritesheet() {
            const box = document.getElementById('capture-box');
            const frames = parseInt(document.getElementById('frameCount').value);
            const target = document.getElementById('target').value;
            const imgEl = document.getElementById('preview-img');
            const textEl = document.getElementById('preview-text');
            
            const frameCanvases = [];
            
            // Stop live animation to take manual snapshots
            imgEl.classList.remove('flicker-active');
            textEl.classList.remove('flicker-active');

            for (let i = 0; i < frames; i++) {
                // Simulate flicker by randomly toggling opacity per frame
                const opacity = Math.random() > 0.7 ? 0.1 : 1.0;
                
                if(target === 'both' || target === 'image') imgEl.style.opacity = opacity;
                if(target === 'both' || target === 'text') textEl.style.opacity = opacity;

                const canvas = await html2canvas(box, { backgroundColor: null, logging: false });
                frameCanvases.push(canvas);
            }

            // Reset styles
            imgEl.style.opacity = 1;
            textEl.style.opacity = 1;
            update();

            // Create Master Spritesheet
            const masterCanvas = document.createElement('canvas');
            const ctx = masterCanvas.getContext('2d');
            masterCanvas.width = frameCanvases[0].width * frames;
            masterCanvas.height = frameCanvases[0].height;

            frameCanvases.forEach((canvas, index) => {
                ctx.drawImage(canvas, index * canvas.width, 0);
            });

            const resultContainer = document.getElementById('canvas-result');
            resultContainer.innerHTML = '';
            const finalImg = new Image();
            finalImg.src = masterCanvas.toDataURL("image/png");
            finalImg.style.maxWidth = "100%";
            resultContainer.appendChild(finalImg);
            document.getElementById('sprite-preview-container').style.display = 'block';

            // Auto-download
            const link = document.createElement('a');
            link.download = 'flicker-spritesheet.png';
            link.href = finalImg.src;
            link.click();
        }
    </script>
</body>
</html>
